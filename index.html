<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悟空财经分析</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-start: #0d1117;
            --bg-end: #161b22;
            --green: #3fb950;
            --green-bg: rgba(63,185,80,0.12);
            --orange: #f0883e;
            --red: #f85149;
            --blue: #58a6ff;
            --gold: #d29922;
            --purple: #a371f7;
            --card-bg: rgba(255,255,255,0.04);
            --card-border: rgba(255,255,255,0.1);
            --text: #e6edf3;
            --text-dim: #8b949e;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.7;
        }
        .container { max-width: 900px; margin: 0 auto; }

        /* ===== 页面切换导航 ===== */
        .page-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(135deg, #0d1117, #161b22);
            padding: 12px 0 8px;
            backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .page-nav .page-btn {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .page-nav .page-btn-timeline {
            background: rgba(63,185,80,0.15);
            border: 1px solid rgba(63,185,80,0.4);
            color: #3fb950;
        }
        .page-nav .page-btn-timeline:hover,
        .page-nav .page-btn-timeline.active {
            background: rgba(63,185,80,0.25);
            border-color: #3fb950;
            box-shadow: 0 0 12px rgba(63,185,80,0.3);
        }
        .page-nav .page-btn-review {
            background: rgba(255,193,7,0.1);
            border: 1px solid rgba(255,193,7,0.3);
            color: #d29922;
        }
        .page-nav .page-btn-review:hover {
            background: rgba(255,193,7,0.2);
            border-color: #d29922;
            box-shadow: 0 0 12px rgba(255,193,7,0.3);
        }
        .page-nav .page-btn-events {
            background: rgba(163,113,247,0.15);
            border: 1px solid rgba(163,113,247,0.4);
            color: #a371f7;
        }
        .page-nav .page-btn-events:hover {
            background: rgba(163,113,247,0.25);
            border-color: #a371f7;
            box-shadow: 0 0 12px rgba(163,113,247,0.3);
        }
        .page-nav .page-btn-macro {
            background: rgba(57,208,216,0.15);
            border: 1px solid rgba(57,208,216,0.4);
            color: #39d0d8;
        }
        .page-nav .page-btn-macro:hover {
            background: rgba(57,208,216,0.25);
            border-color: #39d0d8;
            box-shadow: 0 0 12px rgba(57,208,216,0.3);
        }

        /* ===== 标题 ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }
        .header h1 {
            font-size: 26px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--green) 0%, var(--blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-style: italic;
        }
        .header .date-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(163,113,247,0.15);
            border: 1px solid rgba(163,113,247,0.3);
            border-radius: 8px;
            color: var(--purple);
            font-size: 13px;
        }

        /* ===== 导航 ===== */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            padding: 14px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            align-items: center;
        }
        .date-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            color: var(--text-dim);
        }
        .date-btn:hover {
            background: rgba(63,185,80,0.1);
            border-color: var(--green);
            color: var(--green);
        }
        .date-btn.active {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--green);
            font-weight: 600;
        }
        /* 日期选择器 */
        .date-picker-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 8px;
        }
        .date-picker-wrap label {
            font-size: 13px;
            color: var(--text-dim);
        }
        .date-picker {
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            font-family: var(--font);
        }
        .date-picker:hover {
            border-color: var(--green);
        }
        .date-picker:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(63,185,80,0.2);
        }
        /* 前一日/后一日按钮 */
        .nav-arrow-btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-arrow-btn:hover:not(:disabled) {
            background: rgba(63,185,80,0.1);
            border-color: var(--green);
            color: var(--green);
        }
        .nav-arrow-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .nav-divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            margin: 0 4px;
        }

        /* ===== 区块通用 ===== */
        .section {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            padding: 22px;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* ===== 今日基调 ===== */
        .tone-section {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(210,153,34,0.08) 0%, rgba(210,153,34,0.03) 100%);
        }
        .tone-section .section-title { color: var(--gold); }
        .tone-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text);
        }
        .tone-item {
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
        }
        .tone-label {
            font-weight: 600;
            color: var(--gold);
            margin-right: 8px;
        }

        /* ===== 悟空判断 ===== */
        .judgment-section { 
            background: linear-gradient(135deg, rgba(163,113,247,0.08) 0%, rgba(88,166,255,0.05) 100%);
            border-color: rgba(163,113,247,0.2);
        }
        .judgment-section .section-title { color: var(--purple); }
        
        /* ===== 八戒贝叶斯 ===== */
        .bayesian-section {
            background: linear-gradient(135deg, rgba(255,193,7,0.08) 0%, rgba(255,152,0,0.05) 100%);
            border-color: rgba(255,193,7,0.2);
        }
        .bayesian-section .section-title { color: #FFC107; }
        .overall-card {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .overall-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .stat-label { font-size: 12px; color: var(--text-dim); }
        .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }
        .stat-value.high { color: var(--green); }
        .stat-value.medium { color: #FFC107; }
        .stat-value.low { color: #f44336; }
        .overall-conclusion {
            font-size: 14px;
            line-height: 1.6;
            padding: 12px;
            background: rgba(255,193,7,0.08);
            border-radius: 8px;
            border-left: 3px solid #FFC107;
        }
        .decision-matrix {
            margin-top: 16px;
        }
        .matrix-title {
            font-size: 14px;
            font-weight: 600;
            color: #FFC107;
            margin-bottom: 12px;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .matrix-table th {
            text-align: left;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            font-weight: 600;
        }
        .matrix-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .win-rate { font-weight: 600; }
        .win-rate.high { color: var(--green); }
        .win-rate.medium { color: #FFC107; }
        .win-rate.low { color: #f44336; }

        /* 贝叶斯推断卡片 */
        .bayes-analysis-list { margin-top: 16px; }
        .bayes-card {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .bayes-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #FFC107;
            margin-bottom: 10px;
        }
        .bayes-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .bayes-table th {
            text-align: left;
            padding: 7px 8px;
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            font-weight: 600;
        }
        .bayes-table td {
            padding: 7px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .bayes-table .posterior-row td {
            border-top: 2px solid rgba(255,193,7,0.3);
            background: rgba(255,193,7,0.05);
        }
        .key-variable {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-dim);
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
        }

        /* 八戒最终结论 */
        .bajie-conclusion {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(33,150,243,0.15) 0%, rgba(25,118,210,0.1) 100%);
            border: 1px solid rgba(33,150,243,0.4);
            border-radius: 10px;
            padding: 16px;
        }
        .bajie-conclusion-title {
            font-size: 15px;
            font-weight: 700;
            color: #FFC107;
            margin-bottom: 12px;
        }
        .bajie-conclusion-row {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .bc-label {
            color: var(--text-dim);
            font-weight: 600;
        }

        /* ===== 沙僧韭菜直觉 ===== */
        .sangsha-section {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(156,39,176,0.12) 0%, rgba(103,58,183,0.08) 100%);
            border: 1px solid rgba(156,39,176,0.3);
            border-radius: 12px;
            padding: 16px;
        }
        .sangsha-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .sangsha-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .sg-meta-tag {
            font-size: 12px;
            color: #ce93d8;
            background: rgba(156,39,176,0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .sg-sentiment {
            font-size: 15px;
            font-weight: 700;
            color: #ce93d8;
        }
        .sg-advice {
            font-size: 13px;
            color: var(--text-dim);
        }
        .sangsha-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .sg-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }
        .stat-value.buy { color: #ef5350; }
        .stat-value.panic { color: #ffa726; }
        .sangsha-top-news {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 12px;
        }
        .sg-top-title {
            font-size: 13px;
            font-weight: 600;
            color: #ce93d8;
            margin-bottom: 12px;
        }
        .sg-news-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sg-news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .sg-news-rank {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ef5350, #e53935);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .sg-news-content {
            flex: 1;
        }
        .sg-news-title {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 4px;
        }
        .sg-news-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }
        .sg-buy-prob {
            color: #ef5350;
            font-weight: 600;
        }
        .sg-tags {
            color: var(--text-dim);
        }
        .sg-date {
            color: var(--text-dim);
            font-size: 11px;
        }

        /* ===== 唐憎最终仲裁 ===== */
        .tang-sanzang-section {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(255,193,7,0.08) 0%, rgba(255,152,0,0.06) 100%);
            border: 1px solid rgba(255,193,7,0.3);
            border-radius: 12px;
            padding: 16px;
        }
        .tang-position-banner {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            align-items: center;
        }
        .ts-position {
            font-size: 15px;
            font-weight: 700;
            color: #FFC107;
            background: rgba(255,193,7,0.15);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .ts-action {
            font-size: 15px;
            font-weight: 600;
            color: #FFD54F;
        }
        .tang-body {
            font-size: 13px;
            color: var(--text);
        }
        .ts-subtitle {
            font-weight: 700;
            color: #FFC107;
            margin: 8px 0 4px;
        }
        .ts-conflict-item {
            padding: 3px 0 3px 8px;
            color: #FFC107;
            font-size: 12px;
            border-left: 2px solid rgba(255,193,7,0.4);
            margin-bottom: 3px;
        }
        .ts-formula {
            margin-top: 10px;
            padding: 8px 10px;
            background: rgba(163,113,247,0.12);
            border: 1px solid rgba(163,113,247,0.25);
            border-radius: 6px;
            font-size: 12px;
            color: #b388ff;
            font-family: monospace;
        }
        .ts-risk-item {
            padding: 3px 0 3px 8px;
            color: #f44336;
            font-size: 12px;
            border-left: 2px solid rgba(244,67,54,0.5);
            margin-bottom: 3px;
        }
        .ts-conclusion {
            margin-top: 10px;
            padding: 8px 10px;
            background: rgba(76,175,80,0.1);
            border: 1px solid rgba(76,175,80,0.25);
            border-radius: 6px;
            font-size: 13px;
            color: #81C784;
        }

        /* ===== 白龙马主力行为 ===== */
        .white-dragon-section {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(33,150,243,0.12) 0%, rgba(25,118,210,0.08) 100%);
            border: 1px solid rgba(33,150,243,0.3);
            border-radius: 12px;
            padding: 16px;
        }
        .wd-main-state {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .wd-label {
            font-size: 14px;
            color: var(--text-dim);
        }
        .wd-value {
            font-size: 16px;
            font-weight: 700;
        }
        .wd-stage {
            font-size: 13px;
            color: var(--text-dim);
        }
        .state-拉升 { color: var(--green); }
        .state-出货 { color: #ef5350; }
        .state-吸筹 { color: #29b6f6; }
        .state-洗盘 { color: #ffa726; }
        .state-分化 { color: #bdbdbd; }
        .state-观望 { color: var(--text-dim); }
        .wd-explain {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .wd-using-retail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .wd-using-retail.warning { color: #ef5350; }
        .wd-using-retail.normal { color: var(--green); }
        .wd-advice {
            font-size: 14px;
            font-weight: 600;
            color: #64b5f6;
            padding: 12px;
            background: rgba(33,150,243,0.15);
            border-radius: 8px;
        }

        .emotion-row {
            font-size: 14px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .emotion-label { color: var(--text-dim); }
        .emotion-value { 
            color: var(--green); 
            font-weight: 600;
        }
        .analysis-list {
            margin-bottom: 16px;
        }
        .analysis-item {
            position: relative;
            padding-left: 18px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .analysis-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--text-dim);
        }
        .strategy-box {
            background: linear-gradient(135deg, rgba(63,185,80,0.15) 0%, rgba(63,185,80,0.08) 100%);
            border: 1px solid rgba(63,185,80,0.3);
            border-radius: 10px;
            padding: 16px;
            margin-top: 8px;
        }
        .strategy-label {
            font-size: 13px;
            color: var(--green);
            font-weight: 600;
            margin-bottom: 10px;
        }
        .strategy-item {
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        /* ===== 新闻区块 ===== */
        .news-section.s-level .section-title { color: var(--red); }
        .news-section.a-level .section-title { color: var(--gold); }
        .news-section.douyin .section-title { color: var(--blue); }

        /* ===== 上帝双时空复盘 ===== */
        .god-perspective-section {
            margin-top: 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.12) 0%, rgba(255,152,0,0.08) 100%);
            border: 2px solid rgba(255,215,0,0.4);
            border-radius: 12px;
            padding: 16px;
        }
        .god-perspective-section .section-title { color: #FFD700; }
        .god-core-formula {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-family: monospace;
            color: #FFD700;
            text-align: center;
            font-size: 13px;
        }
        .god-step {
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .god-step-title {
            font-weight: 600;
            color: #FFD700;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .god-step-content {
            font-size: 13px;
            color: var(--text);
            line-height: 1.6;
        }
        .god-priority-badge {
            display: inline-block;
            background: rgba(248,81,73,0.3);
            color: #FF6B6B;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        .god-check-pass { color: var(--green); }
        .god-check-warn { color: var(--orange); }
        .god-check-fail { color: var(--red); }
        .god-iron-law {
            background: rgba(255,215,0,0.1);
            border-left: 3px solid #FFD700;
            padding: 8px 12px;
            margin: 8px 0;
            font-size: 13px;
        }
        .god-position-box {
            background: rgba(63,185,80,0.15);
            border: 1px solid rgba(63,185,80,0.4);
            border-radius: 8px;
            padding: 12px;

        .tag-sentiment.bullish { background: var(--red); color: #fff; }

<body>
    <div class="container">
        <!-- 页面切换导航 -->
        <div class="page-nav">
            <a href="index.html" class="page-btn page-btn-timeline active">📅 新闻时间线</a>
            <a href="review.html" class="page-btn page-btn-review">📊 复盘报告</a>
            <a href="monthly-events.html" class="page-btn page-btn-events">📅 每月重大事件</a>
            <a href="macro-indicators.html" class="page-btn page-btn-macro">🌍 宏观因子</a>
        </div>

        <div class="header">
            <h1>🐵 悟空财经分析</h1>
            <div class="subtitle">不盲从主流解读，用逻辑和数据说话</div>
            <div class="date-tag" id="dateDisplay"></div>
        </div>

        <!-- 日期导航 -->
        <div class="nav-bar" id="navBar">
            <button class="nav-arrow-btn" id="prevBtn" onclick="goToPrevDate()">◀ 前一日</button>
            <div class="nav-divider"></div>
            <div class="date-picker-wrap">
                <label for="datePicker">选择日期：</label>
                <input type="date" id="datePicker" class="date-picker" onchange="onDatePickerChange(this.value)">
            </div>
            <div class="nav-divider"></div>
            <button class="nav-arrow-btn" id="nextBtn" onclick="goToNextDate()">后一日 ▶</button>
        </div>

        <!-- 内容区 -->
        <div id="content"></div>

        <footer>
            <p>数据来源：天集 ProSearch · 权威财经媒体</p>
        </footer>
    </div>

    <!-- 数据加载器 -->
    <script src="news-data-loader.js"></script>
    <script>
        // 动态数据存储
        let newsData = {};
        let availableDates = [];
        let currentDate = null;
        let dataLoaded = false;

        // 初始化数据
        async function initData() {
            try {
                // 加载索引
                const index = await NewsDataLoader.loadIndex();
                availableDates = index.availableDates;
                
                if (availableDates.length === 0) {
                    console.error('没有可用日期');
                    return false;
                }
                
                // 加载最新日期数据
                currentDate = availableDates[0];
                const latestData = await NewsDataLoader.loadDate(currentDate);
                newsData[currentDate] = latestData;
                
                dataLoaded = true;
                console.log('数据加载完成，最新日期:', currentDate);
                return true;
            } catch (error) {
                console.error('数据加载失败:', error);
                return false;
            }
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${parseInt(m)}月${parseInt(d)}日`;
        }

        function initNav() {
            // 设置日期选择器的范围
            const datePicker = document.getElementById('datePicker');
            if (availableDates.length > 0) {
                datePicker.min = availableDates[availableDates.length - 1]; // 最早日期
                datePicker.max = availableDates[0]; // 最晚日期
                datePicker.value = currentDate;
            }
            updateNavButtons();
        }

        function updateNavButtons() {
            const currentIndex = availableDates.indexOf(currentDate);
            document.getElementById('prevBtn').disabled = currentIndex >= availableDates.length - 1;
            document.getElementById('nextBtn').disabled = currentIndex <= 0;
        }

        async function onDatePickerChange(value) {
            if (value && availableDates.includes(value)) {
                currentDate = value;
                // 如果数据未加载，先加载
                if (!newsData[currentDate]) {
                    try {
                        const data = await NewsDataLoader.loadDate(currentDate);
                        newsData[currentDate] = data;
                    } catch (error) {
                        console.error('加载日期数据失败:', error);
                        return;
                    }
                }
                updateUI();
            }
        }

        async function goToPrevDate() {
            const currentIndex = availableDates.indexOf(currentDate);
            if (currentIndex < availableDates.length - 1) {
                currentDate = availableDates[currentIndex + 1];
                // 按需加载数据
                if (!newsData[currentDate]) {
                    try {
                        const data = await NewsDataLoader.loadDate(currentDate);
                        newsData[currentDate] = data;
                    } catch (error) {
                        console.error('加载日期数据失败:', error);
                        return;
                    }
                }
                updateUI();
            }
        }

        async function goToNextDate() {
            const currentIndex = availableDates.indexOf(currentDate);
            if (currentIndex > 0) {
                currentDate = availableDates[currentIndex - 1];
                // 按需加载数据
                if (!newsData[currentDate]) {
                    try {
                        const data = await NewsDataLoader.loadDate(currentDate);
                        newsData[currentDate] = data;
                    } catch (error) {
                        console.error('加载日期数据失败:', error);
                        return;
                    }
                }
                updateUI();
            }
        }

        function updateUI() {
            // 更新日期选择器
            document.getElementById('datePicker').value = currentDate;
            // 更新导航按钮状态
            updateNavButtons();
            // 更新日期显示
            document.getElementById('dateDisplay').textContent = formatDate(currentDate);
            renderContent();
        }

        function getSentimentClass(sentiment) {
            if (!sentiment) return 'neutral';
            // 强烈利好（带警告）显示为橙色
            if (sentiment.includes('强烈利好')) return 'avoid';
            // 匹配包含关键词的字符串（如"利好 ✅政策底确立"）
            if (sentiment.includes('利好')) return 'bullish';
            if (sentiment.includes('利空')) return 'bearish';
            if (sentiment.includes('关注')) return 'watch';
            if (sentiment.includes('警惕')) return 'avoid';
            if (sentiment.includes('回避')) return 'avoid';
            if (sentiment.includes('中性')) return 'neutral';
            return 'neutral';
        }

        function renderTags(items) {
            if (!items || !items.length) return '';
            let html = '<div class="tags-wrap">';
            items.forEach(item => {
                // 兼容纯字符串和对象两种格式
                const isObj = typeof item === 'object' && item !== null;
                const sentiment = isObj ? item.sentiment : '';
                const name = isObj ? item.name : item;
                const note = isObj ? (item.note || '') : '';
                const cls = getSentimentClass(sentiment);
                html += `<span class="tag-item">`;
                if (sentiment) {
                    html += `<span class="tag-sentiment ${cls}">${sentiment}</span>`;
                }
                html += `<span class="tag-name">${name}</span>`;
                if (note) {
                    html += `<span class="tag-note">${note}</span>`;
                }
                html += '</span>';
            });
            html += '</div>';
            return html;
        }

        function renderNewsCard(item) {
            let html = `
                <div class="news-card">
                    <div class="news-header">
                        <div class="news-title">${item.emoji} ${item.title}</div>
                        ${item.source ? '<div class="news-source">来源：' + item.source + '</div>' : ''}
                    </div>
                    <div class="news-row"><span class="label">要点：</span>${item.key_points || item.key_point || item.summary || ''}</div>
                    <div class="news-row"><span class="label">影响时长：</span>${item.duration || '1-3天'}</div>`;

            // 支持新的 etf_mapping 格式
            const etfMapping = item.etf_mapping || item.etfs;
            if (etfMapping && etfMapping.length) {
                const etfItems = etfMapping.map(e => {
                    if (typeof e === 'object' && e.code) {
                        return { name: `${e.code} ${e.name}`, sentiment: e.type || '利好', reason: e.reason };
                    }
                    return typeof e === 'object' ? e : { name: e, sentiment: '利好' };
                });
                html += `
                    <div class="mapping-section">
                        <div class="mapping-row">
                            <div class="mapping-label">📈 ETF映射：</div>
                            ${renderTags(etfItems)}
                        </div>
                    </div>`;
            }

            // 支持新的 stock_mapping 格式
            const stockMapping = item.stock_mapping || item.stocks;
            if (stockMapping && stockMapping.length) {
                const stockItems = stockMapping.map(s => {
                    if (typeof s === 'object' && s.name) {
                        return { name: s.name, sentiment: s.type || '利好', reason: s.reason };
                    }
                    return typeof s === 'object' ? s : { name: s, sentiment: '利好' };
                });
                html += `
                    <div class="mapping-section">
                        <div class="mapping-row">
                            <div class="mapping-label">✨ 个股映射：</div>
                            ${renderTags(stockItems)}
                        </div>
                    </div>`;
            }

            if (item.signal) {
                html += `<div class="warning-box">💡 ${item.signal}</div>`;
            }

            html += '</div>';
            return html;
        }

        // 渲染单条新闻的贝叶斯分析
        function renderNewsBayesAnalysis(newsTitle, bayesData) {
            if (!bayesData) return '';
            const pc = bayesData.posterior_probability || bayesData.posterior >= 65 ? 'high' : bayesData.posterior >= 50 ? 'medium' : 'low';
            const priorProbRaw = bayesData.prior_probability || bayesData.prior_prob || bayesData.prior || 50;
            const likelihoodProbRaw = bayesData.likelihood || bayesData.likelihood_prob || 50;
            const posteriorRaw = bayesData.posterior_probability || bayesData.posterior || 50;
            // 移除可能的%符号
            const priorProb = String(priorProbRaw).replace(/%/g, '');
            const likelihoodProb = String(likelihoodProbRaw).replace(/%/g, '');
            const posterior = String(posteriorRaw).replace(/%/g, '');
            const expectedReturn = bayesData.expected_return || 'N/A';
            const confidence = bayesData.confidence_interval || bayesData.confidence || 'N/A';
            const keyFactors = bayesData.key_factors || bayesData.key_variables || bayesData.key_variable || 'N/A';
            const wukongValidation = bayesData.wukong_validation || '';
            return `
            <div class="bayes-detail-card">
                <div class="bayes-detail-header">
                    <span class="bayes-detail-title">📊 ${newsTitle}</span>
                </div>
                <div class="bayes-probability-row">
                    <div class="bayes-prob-item">
                        <div class="bayes-prob-label">先验概率</div>
                        <div class="bayes-prob-value">${priorProb}%</div>
                    </div>
                    <div class="bayes-prob-item">
                        <div class="bayes-prob-label">似然</div>
                        <div class="bayes-prob-value">${likelihoodProb}%</div>
                    </div>
                    <div class="bayes-prob-item">
                        <div class="bayes-prob-label">后验概率</div>
                        <div class="bayes-prob-value ${pc}">${posterior}%</div>
                    </div>
                </div>
                <div class="bayes-detail-row">
                    <span class="bayes-detail-label">预期收益：</span>
                    <span class="bayes-detail-value">${expectedReturn}</span>
                    <span class="bayes-detail-label">置信区间：</span>
                    <span class="bayes-detail-value">${confidence}</span>
                </div>
                <div class="bayes-detail-factors">
                    <span class="bayes-detail-label">💡 关键因子：</span>${keyFactors}
                </div>
                ${wukongValidation ? `<div class="bayes-detail-wukong">
                    <span class="bayes-detail-label">🐵 悟空验证：</span>${wukongValidation}

                    const action = wr >= 65 ? '✅ 坚定做多' : wr >= 50 ? '⚠️ 轻仓' : '❌ 回避';

                        expected_return: ba.expected_return || 'N/A',
                        risk_ratio: wr >= 65 ? '1:3' : wr >= 50 ? '1:2' : '1:1',

                            </div>
                        </div>` : ''}
                        
                        <!-- 验证标准 -->
                        ${gp.final_decision?.validation_criteria ? `
                        <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.1);">
                            <div style="font-weight:600;color:#FFD700;margin-bottom:8px;">✅ 验证标准（次日对照）</div>
                            <div class="god-validation">
                                <div><strong>次日成功：</strong><span style="color:var(--green);">${gp.final_decision.validation_criteria.next_day.success}</span></div>
                                <div><strong>次日失败：</strong><span style="color:var(--red);">${gp.final_decision.validation_criteria.next_day.failure}</span></div>
                                <div><strong>3日成功：</strong><span style="color:var(--green);">${gp.final_decision.validation_criteria['3_days'].success}</span></div>
                                <div><strong>参考基准：</strong>${gp.final_decision.validation_criteria.key_reference}</div>
                            </div>
                        </div>` : ''}
                    </div>
                    
                    <div class="god-attribution-grid">`;
                const attr = gp.five_layer_attribution || {};
                const attrItems = [
                    {key: 'news_judgment', label: '①新闻判断'},
                    {key: 'narrative_judgment', label: '②叙事判断'},
                    {key: 'growth_attribute', label: '③增长属性'},
                    {key: 'profit_center_capex', label: '④收税人+Capex'},
                    {key: 'living_force_time', label: '⑤有生力量'}
                ];
                attrItems.forEach(item => {
                    if (attr[item.key]) {
                        html += `
                            <div class="god-attribution-item">
                                <div class="god-attribution-weight">${attr[item.key].weight || '-'}</div>
                                <div class="god-attribution-desc">${item.label}</div>
                            </div>`;
                    }
                });
                html += `
                    </div>
                </div>`;
            }

            // 分隔线
            html += `<div class="section-divider"><span>=== 新闻详情 ===</span></div>`;

            // 智能匹配新闻和贝叶斯分析
            function findBayesForNews(newsTitle, newsAnalysisList, decisionMatrix) {
                if (!newsAnalysisList) return null;
                
                // 1. 精确匹配
                const exact = newsAnalysisList.find(na => na.news_title === newsTitle);
                if (exact) return exact;
                
                // 2. 核心概念匹配（提取2-4字的核心概念进行匹配）
                const titlePrefix = newsTitle.replace(/[：:].*$/, '');
                const coreConcepts = [];
                
                // 提取常见财经概念词
                const conceptPatterns = ['原油', '黄金', '美股', 'AI芯片', '芯片', 'CPO', '光模块', 'A股', '央行', '油气', '科技', '存储', '新能源', '锂电', '光伏', '医药', '银行', '地产'];
                conceptPatterns.forEach(concept => {
                    if (titlePrefix.includes(concept)) {
                        coreConcepts.push(concept);
                    }
                });
                
                // 按概念匹配
                for (const na of newsAnalysisList) {
                    for (const concept of coreConcepts) {
                        if (na.news_title.includes(concept)) {
                            return na;
                        }
                    }
                }
                
                // 3. 反向包含匹配
                for (const na of newsAnalysisList) {
                    if (newsTitle.includes(na.news_title) || na.news_title.includes(newsTitle.substring(0, 10))) {
                        return na;
                    }
                }

                // 4. 决策矩阵匹配
                if (decisionMatrix) {
                    for (const dm of decisionMatrix) {
                        // 检查决策矩阵的新闻名称是否在新闻标题中
                        if (newsTitle.includes(dm.news) || 
                            (dm.news.length > 4 && titlePrefix.includes(dm.news.substring(0, 6)))) {
                            const matched = newsAnalysisList.find(na => na.news_title === dm.news);
                            if (matched) return matched;
                        }
                        // 检查核心概念是否匹配
                        for (const concept of coreConcepts) {
                            if (dm.news.includes(concept)) {
                                const matched = newsAnalysisList.find(na => na.news_title === dm.news);
                                if (matched) return matched;
                            }
                        }
                    }
                }
                
                return null;
            }

            // S级
            if (data.s_level && data.s_level.length) {
                html += `
                    <div class="section news-section s-level">
                        <div class="section-title">🔴 S级（结构性叙事，影响1-4周）</div>`;
                data.s_level.forEach(item => {
                    html += renderNewsCard(item);
                    const bayes = item.bayes_analysis || findBayesForNews(item.title, bj?.news_analysis, bj?.decision_matrix);
                    if (bayes) {
                        html += renderNewsBayesAnalysis(item.title, bayes);
                    }
                });
                html += '</div>';
            }

            // A级
            if (data.a_level && data.a_level.length) {
                html += `
                    <div class="section news-section a-level">
                        <div class="section-title">🟡 A级（阶段性叙事，影响1-3天）</div>`;
                data.a_level.forEach(item => {
                    html += renderNewsCard(item);
                    const bayes = item.bayes_analysis || findBayesForNews(item.title, bj?.news_analysis, bj?.decision_matrix);
                    if (bayes) {
                        html += renderNewsBayesAnalysis(item.title, bayes);
                    }
                });
                html += '</div>';
            }

            // 抖音/平台
            if (data.douyin && data.douyin.length) {
                html += `
                    <div class="section news-section douyin">
                        <div class="section-title">📱 抖音/平台相关</div>`;
                data.douyin.forEach(item => {
                    html += renderNewsCard(item);
                    const bayes = item.bayes_analysis || findBayesForNews(item.title, bj?.news_analysis, bj?.decision_matrix);
                    if (bayes) {
                        html += renderNewsBayesAnalysis(item.title, bayes);
                    }
                });
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
            } catch (error) {
                console.error('Render error:', error);
                document.getElementById('content').innerHTML = '<p style="text-align:center;color:#f85149;padding:60px;">渲染错误: ' + error.message + '</p>';
            }
        }

        // 初始化
        async function init() {
            const success = await initData();
            if (success) {
                initNav();
                updateUI();
            } else {
                document.getElementById('content').innerHTML = 
                    '<p style="text-align:center;color:#f85149;padding:60px;">数据加载失败，请刷新页面重试</p>';
            }
        }
        
        init();
    </script>
</body>
</html>
